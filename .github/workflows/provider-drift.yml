name: Provider Drift

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  surface-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Compare the consumed provider surface against the latest published modules
        run: make surface-check

  latest-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: github.com/anthropics/anthropic-sdk-go
            dirs: anthropic
          - module: github.com/openai/openai-go/v3
            dirs: openai perplexity
          - module: google.golang.org/genai
            dirs: google
    env:
      MODULE: ${{ matrix.module }}
      DIRS: ${{ matrix.dirs }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Resolve installed and latest versions
        id: versions
        run: |
          FIRST_DIR=$(echo "$DIRS" | cut -d' ' -f1)
          INSTALLED=$(cd "$FIRST_DIR" && go list -m -f '{{.Version}}' "$MODULE")
          LATEST=$(cd "$FIRST_DIR" && GOFLAGS=-mod=mod GOWORK=off go list -m -f '{{.Version}}' "$MODULE@latest")
          echo "installed=$INSTALLED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Skip when already on latest
        if: steps.versions.outputs.installed == steps.versions.outputs.latest
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: echo "$MODULE is already at $LATEST"

      - name: Bump to latest and run the suite
        id: suite
        if: steps.versions.outputs.installed != steps.versions.outputs.latest
        continue-on-error: true
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          for dir in $DIRS; do
            (cd "$dir" && go get "$MODULE@$LATEST" && go mod tidy && go build ./... && go vet ./... && go test -race ./...) || exit 1
          done

      - name: Check whether an issue already tracks this version
        id: existing
        if: steps.versions.outputs.installed != steps.versions.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          TITLE="Provider drift: $MODULE $LATEST"
          COUNT=$(gh issue list --repo "$REPO" --label "provider-drift" --state all --limit 200 --json title \
            | jq --arg t "$TITLE" '[.[] | select(.title == $t)] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Ensure label exists
        if: steps.versions.outputs.installed != steps.versions.outputs.latest && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh label create "provider-drift" --repo "$REPO" --color "D93F0B" --description "Upstream provider SDK release to review" 2>/dev/null || true

      - name: Open the tracking issue
        if: steps.versions.outputs.installed != steps.versions.outputs.latest && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INSTALLED: ${{ steps.versions.outputs.installed }}
          LATEST: ${{ steps.versions.outputs.latest }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$REPO" \
            --title "Provider drift: $MODULE $LATEST" \
            --label "provider-drift" \
            --body "**Module**: \`$MODULE\` ($DIRS)
          **Installed**: $INSTALLED
          **Latest**: $LATEST
          **Suite against latest**: $SUITE_OUTCOME
          **Run** (surface-check output is in the surface-check job): $RUN_URL

          - [ ] Read the surface-check job: removed fields or unmapped stop reasons block a bump
          - [ ] Bump the pin in $DIRS, run \`make test-all\`
          - [ ] Meter any new usage field the metering API accepts
          - [ ] Add a CHANGELOG entry and publish"

      - name: Fail the job when the suite failed against latest
        if: steps.suite.outcome == 'failure'
        run: exit 1
