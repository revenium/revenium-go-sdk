name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
        module:
          - core
          - openai
          - anthropic
          - google
          - litellm
          - fal
          - runway
          - ollama
          - perplexity
          - groq
          - grok

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.module }}-

      - name: Tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out

  test-minimum-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: [core, fal, runway, groq, grok, ollama, litellm, webhooks]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and test ${{ matrix.module }} on the oldest supported toolchain
        working-directory: ${{ matrix.module }}
        run: |
          GOWORK=off GOTOOLCHAIN=local go build ./...
          GOWORK=off GOTOOLCHAIN=local go vet ./...
          GOWORK=off GOTOOLCHAIN=local go test -race ./...

  surface-check-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: cd scripts/provider-surface-check && go run . --selftest
